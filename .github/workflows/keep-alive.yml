# Supabase 무료 요금제는 7일 동안 요청이 없으면 프로젝트를 일시정지합니다.
# 사흘마다 한 번 서버에 가벼운 요청을 보내 잠들지 않게 합니다.
# 서버 주소와 공개 키는 배포된 사이트에서 읽어 오므로 저장소에 키를 두지 않습니다.
# (GitHub 예약 실행은 기본 브랜치(main)에 이 파일이 있어야 동작합니다.)
name: Supabase 깨어 있게 하기

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 사이트에서 서버 주소·공개 키 읽기, 요청 보내기
        env:
          SITE: https://baduk-lesson.onrender.com
        run: |
          set -eu
          url=""; key=""
          for f in $(curl -fsS --retry 3 "$SITE/" | grep -oE '/assets/[^"]+\.js'); do
            js=$(curl -fsS --retry 3 "$SITE$f")
            [ -z "$url" ] && url=$(printf '%s' "$js" | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -n1 || true)
            [ -z "$key" ] && key=$(printf '%s' "$js" | grep -oE 'sb_publishable_[A-Za-z0-9_-]+' | head -n1 || true)
          done
          if [ -z "$url" ] || [ -z "$key" ]; then echo "사이트에서 서버 정보를 찾지 못했습니다."; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            -H "apikey: $key" "$url/rest/v1/profiles?select=id&limit=1")
          echo "응답 코드: $code"
          [ "$code" = "200" ]
